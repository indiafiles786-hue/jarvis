workflows:
  android-apk:
    name: SolveGenius Android APK
    max_build_duration: 60
    environment:
      node: 20.11.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Fix Expo dependency versions
        script: npx expo install --fix
      - name: Prebuild Android project
        script: npx expo prebuild --platform android --clean
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
